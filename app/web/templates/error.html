{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block encabezado %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="mx-auto w-full max-w-lg">
  <div class="tarjeta text-center">
    <span class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-red-50 text-red-600">
      <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M12 9v4m0 3h.01M10.3 3.9 2.6 17.1a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path>
      </svg>
    </span>
    <h1 class="mt-4">{{ titulo }}</h1>
    <p class="error mt-2">{{ mensaje }}</p>
    <p class="mt-5"><a href="/">Volver al inicio</a></p>
  </div>
</div>
{% endblock %}

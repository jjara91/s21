[project]
name = "s21"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "jinja2",
    "python-multipart",
    "itsdangerous",
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "reportlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
